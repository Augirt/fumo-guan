<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>伏魔关 · 招贤录</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{height:100%;background:#0b0a08;overflow:hidden;font-family:"PingFang SC","Hiragino Sans GB","Microsoft Yahei","Songti SC",serif;color:#e8e0cc}
#stage{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);width:min(100vw,calc(100vh*0.5625));height:min(100vh,calc(100vw*1.7778));background:#14120d;overflow:hidden;box-shadow:0 0 60px #000}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.ov{position:absolute;inset:0;display:none;z-index:10}
.ov.on{display:flex}
/* ---------- HUD ---------- */
#hud{position:absolute;inset:0;pointer-events:none;display:none;z-index:5}
#hud.on{display:block}
#topbar{position:absolute;top:0;left:0;right:0;padding:8px 10px 6px;background:linear-gradient(#000c,#0000)}
#lvltag{font-size:13px;font-weight:700;color:#d4af37;text-shadow:0 1px 2px #000;letter-spacing:1px}
#goldtag{font-size:13px;color:#d4af37;float:right;text-shadow:0 1px 2px #000}
#xpwrap{margin-top:4px;height:14px;background:#000a;border:1px solid #4a3f22;border-radius:7px;position:relative;overflow:hidden}
#xpbar{height:100%;width:0%;background:linear-gradient(90deg,#8a6a1a,#d4af37)}
#xptext{position:absolute;inset:0;text-align:center;font-size:10px;line-height:14px;color:#fff;text-shadow:0 1px 2px #000}
#wallwrap{position:absolute;left:10px;right:10px;bottom:8px;height:16px;background:#000a;border:1px solid #5a2a1a;border-radius:8px;overflow:hidden}
#wallbar{height:100%;width:100%;background:linear-gradient(90deg,#a0341e,#d4703a)}
#walltext{position:absolute;inset:0;text-align:center;font-size:10px;line-height:16px;color:#fff;text-shadow:0 1px 2px #000}
#cdwrap{position:absolute;left:50%;bottom:92px;transform:translateX(-50%);width:110px;height:7px;background:#000a;border-radius:4px;overflow:hidden;display:none}
#cdbar{height:100%;width:100%;background:#d4af37}
#skillrow{position:absolute;left:6px;bottom:110px;display:flex;flex-direction:column;gap:4px;max-height:340px;overflow:hidden}
.skb{width:38px;height:38px;border-radius:6px;background:#000a;border:1px solid #6a5a2a;display:flex;align-items:center;justify-content:center;position:relative}
.skb .cd{position:absolute;inset:0;background:#000b;border-radius:6px;transform-origin:bottom;transform:scaleY(0)}
.skb .lv{position:absolute;right:-2px;bottom:-3px;font-size:10px;color:#d4af37;font-weight:800;text-shadow:0 1px 2px #000}
.skb .seal{font-size:19px;color:#e8d5b0;font-weight:900;font-family:"Songti SC","STSong",serif}
#enemyct{position:absolute;right:10px;top:52px;font-size:11px;color:#c8bda0;text-shadow:0 1px 2px #000;text-align:right}
#ultbtn{position:absolute;right:14px;bottom:110px;width:74px;height:74px;border-radius:50%;pointer-events:auto;cursor:pointer;
  background:radial-gradient(circle at 35% 30%,#e05a3a,#8a1a10 70%);border:3px solid #d4af37;box-shadow:0 0 18px #d4af3766,inset 0 0 12px #0008;
  display:flex;flex-direction:column;align-items:center;justify-content:center;color:#ffe8c0}
#ultbtn .zi{font-size:20px;font-weight:900;font-family:"Songti SC","STSong",serif;letter-spacing:2px;text-shadow:0 2px 3px #000}
#ultbtn .bar{position:absolute;inset:0;border-radius:50%;overflow:hidden}
#ultbtn .fill{position:absolute;left:0;bottom:0;right:0;background:#0009;transition:height .2s}
#ultbtn .pct{font-size:9px;opacity:.9;margin-top:1px}
#ultbtn.rdy{animation:ultp 1s infinite alternate}
@keyframes ultp{from{box-shadow:0 0 10px #d4af3766}to{box-shadow:0 0 30px #d4af37cc}}
#toast{position:absolute;top:20%;left:50%;transform:translateX(-50%);background:#000c;border:1px solid #d4af37;color:#ffe8c0;padding:8px 18px;border-radius:10px;font-size:15px;font-weight:700;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap;z-index:30;font-family:"Songti SC","STSong",serif;letter-spacing:2px}
/* ---------- 招贤三选一 ---------- */
#cards{background:#000a;align-items:center;justify-content:center;flex-direction:column;backdrop-filter:blur(3px)}
#cards h2{color:#d4af37;font-size:22px;margin-bottom:2px;text-shadow:0 2px 4px #000;font-family:"Songti SC","STSong",serif;letter-spacing:6px}
#cards .sub{font-size:11px;color:#9a927a;margin-bottom:12px;letter-spacing:2px}
#cardrow{display:flex;gap:10px;padding:0 12px;max-width:100%}
.card{flex:1;max-width:158px;background:linear-gradient(#26221a,#16130d);border:2px solid #7a6a3a;border-radius:12px;padding:10px 8px 10px;text-align:center;cursor:pointer;transition:transform .1s,border-color .1s}
.card:active{transform:scale(.95)}
.card .seal{width:46px;height:46px;margin:0 auto;border-radius:6px;background:linear-gradient(135deg,#c23a2a,#8a1a10);border:2px solid #d4af37;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:900;color:#ffe8c0;font-family:"Songti SC","STSong",serif;box-shadow:0 2px 6px #000a}
.card.ds .seal{background:linear-gradient(135deg,#3a4455,#1a2230);border-color:#8a9ab5;color:#c8d8f0}
.card .nm{font-size:15px;font-weight:900;color:#ffe8c0;margin:6px 0 1px;font-family:"Songti SC","STSong",serif}
.card .hao{font-size:10px;color:#9a8a5a;margin-bottom:4px}
.card .ds{font-size:11px;color:#c8bda0;line-height:1.45;min-height:48px}
.card .bd{font-size:9px;color:#7a9a8a;margin-top:5px;letter-spacing:1px}
.card .fk{font-size:10px;color:#8a7a4a;margin-top:3px}
.card.rare{border-color:#d4af37}.card.rare .nm{color:#d4af37}
.card.epic{border-color:#c23a2a}.card.epic .nm{color:#ff8a6a}
/* ---------- 聚义塔·天时选择 ---------- */
#twchoice{background:#000a;align-items:center;justify-content:center;flex-direction:column;backdrop-filter:blur(3px)}
#twchoice h2{color:#d4af37;font-size:22px;margin-bottom:2px;text-shadow:0 2px 4px #000;font-family:"Songti SC","STSong",serif;letter-spacing:6px}
#twchoice .sub{font-size:11px;color:#9a927a;margin-bottom:12px;letter-spacing:2px}
#twrow{display:flex;gap:10px;padding:0 12px;max-width:100%}
#twrow .card{max-width:180px}
/* ---------- 菜单 ---------- */
#menu{background:linear-gradient(#1a1710,#0a0906);flex-direction:column}
#mtitle{margin-top:5vh;text-align:center}
#mtitle h1{font-size:36px;color:#d4af37;text-shadow:0 3px 0 #5a3a00,0 6px 16px #000;letter-spacing:8px;font-family:"Songti SC","STSong",serif}
#mtitle .sub{font-size:11px;color:#8a826a;margin-top:6px;letter-spacing:6px}
#mstats{display:flex;gap:14px;justify-content:center;margin:12px 0;font-size:11px;color:#9a927a}
#mstats b{color:#d4af37}
#tabbtns{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:0 16px;width:100%;max-width:400px}
.tab{background:#221e14;border:1px solid #4a422a;border-radius:10px;padding:9px 2px;text-align:center;font-size:13px;font-weight:700;color:#c8bda0;cursor:pointer}
.tab:active{background:#32301e}
#mbody{flex:1;overflow-y:auto;width:100%;max-width:420px;padding:10px 16px 86px;-webkit-overflow-scrolling:touch}
#mbottom{position:absolute;bottom:0;left:0;right:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(#0000,#000d 30%)}
#fightbtn{width:100%;max-width:380px;margin:0 auto;display:block;background:linear-gradient(#c23a2a,#8a1a10);border:none;border-bottom:4px solid #4a0a04;border-radius:14px;color:#ffe8c0;font-size:20px;font-weight:900;padding:14px;letter-spacing:4px;cursor:pointer;text-align:center;font-family:"Songti SC","STSong",serif}
#fightbtn:active{transform:translateY(2px);border-bottom-width:2px}
.row{display:flex;align-items:center;gap:8px;background:#1a1712;border:1px solid #38301c;border-radius:10px;padding:9px 10px;margin-bottom:8px}
.row .ico{font-size:26px;width:38px;height:38px;border-radius:6px;background:linear-gradient(135deg,#c23a2a,#8a1a10);border:1px solid #7a5a2a;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:900;color:#ffe8c0;font-family:"Songti SC","STSong",serif}
.row .info{flex:1;min-width:0}
.row .nm{font-size:13px;font-weight:700;color:#e8e0cc}
.row .ds{font-size:10px;color:#8a826a;margin-top:2px;line-height:1.4}
.row .ds b{color:#d4af37}
.btn{background:#3a3222;border:none;border-radius:8px;color:#d4c8a0;padding:8px 12px;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap}
.btn:active{background:#4a4230}
.btn.dis{opacity:.35;pointer-events:none}
.btn.gold{background:linear-gradient(#c23a2a,#8a1a10);color:#ffe8c0}
#lvlgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:10px}
.lvlcell{aspect-ratio:1;border-radius:8px;background:#221e14;border:1px solid #4a422a;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:15px;font-weight:800;color:#c8bda0;cursor:pointer}
.lvlcell.done{background:#26301a;color:#a0c890}
.lvlcell.cur{background:linear-gradient(#c23a2a,#8a1a10);color:#ffe8c0;border-color:#d4af37}
.lvlcell.lock{opacity:.3;pointer-events:none}
.lvlcell.boss{border-color:#c23a2a;color:#ff9a7a}
.lvlcell small{font-size:8px;font-weight:400;color:inherit;opacity:.8}
/* ---------- 结算 ---------- */
#result{background:#000b;align-items:center;justify-content:center;flex-direction:column;backdrop-filter:blur(3px)}
#result h1{font-size:34px;font-weight:900;margin-bottom:8px;text-shadow:0 3px 8px #000;font-family:"Songti SC","STSong",serif;letter-spacing:6px}
#result .rsub{font-size:13px;color:#c8bda0;margin-bottom:6px}
#result .rgold{font-size:16px;color:#d4af37;font-weight:800;margin-bottom:18px}
#result .btns{display:flex;gap:10px}
#result .btns .btn{font-size:15px;padding:11px 22px}
/* 宋韵志怪绘卷 · 所有纹样及位图随 HTML 离线封装 */

.tab.active{color:#eddbb1}.tab.active:after{content:"";position:absolute;bottom:-10px;left:26%;right:26%;height:2px;background:#bca36b;box-shadow:0 0 8px #d4af3744}
#mbody{max-width:none;min-height:0;padding:16px 20px 96px;scrollbar-width:thin;scrollbar-color:#7c704e55 transparent}
.sectionlabel{display:flex;justify-content:space-between;align-items:center;font-size:10px;letter-spacing:2px;color:#d1bf94;margin:0 0 9px}.sectionlabel small{font:8px Georgia,serif;letter-spacing:2px;color:#83948b}
.campaign{position:relative;overflow:hidden;min-height:88px;border:1px solid #a78c5355;background:linear-gradient(90deg,#101d20ee,#101d2077),var(--battlefield) center 30%/cover;padding:12px 14px;margin-bottom:14px;box-shadow:inset 0 0 0 3px #101b1b66}
.campaign:before,.campaign:after{content:"";position:absolute;width:8px;height:8px;border:1px solid #d0af70;pointer-events:none}.campaign:before{top:3px;left:3px;border-right:0;border-bottom:0}.campaign:after{bottom:3px;right:3px;border-left:0;border-top:0}

function baseDmg(){return 16*(1+.10*SV.build.arsenal)*treMul('yunu',.07)}
function cdBase(){return .50*Math.pow(.93,SV.build.fletch)}
function volleyN(){return 2+Math.min(SV.build.quiver,6)}

function heroSpd(){return 250*(1+.10*(SV.treasure.eq.horse||0))*(1+.60*(G?starVal('daizong'):0)+.30*(G?starVal('huangfuduan'):0))}
function critC(){return Math.min(.75,.05+.04*(SV.treasure.eq.dagger||0)+starVal('huarong')*.10)}
function critM(){return 1.6+starVal('huarong')*.30}
function silverMul(){return 1+.25*starVal('duanjingzhu')}
function treMul(k,per){return 1+per*(SV.treasure.eq[k]||0)}

/* ---------- 松手开火:自本阵好汉位置齐射 ---------- */
function fire(){
  if(!G||G.state!=='battle'||Input.paused||scr.cards.classList.contains('on')||G.cd>0||G.stunT>0)return;
  G.cd=G.cdMax=cdBase()/rateMul();
  const n=volleyN()+starVal('dongping'),spread=n<=2?.035:.16;
  const origin=heroAimOrigin(),hx=origin.x,hy=origin.y;notifyShot();
  for(let i=0;i<n;i++){
    const a=G.aimA+(n>1?(i/(n-1)-.5)*spread:0)+(battleRandom()-.5)*.015;
    G.bullets.push({x:hx+Math.cos(a)*43,y:hy+Math.sin(a)*43,vx:Math.cos(a)*950,vy:Math.sin(a)*950,
      source:'wangjin',dmg:bulletDmg(),pierce:starVal('linchong'),hit:[],r:5,life:2});
  }

}

function spawnFx(x,y,n,col,spd,life,txt,txtcol,size){
  if(txt!==undefined){G.fx.push({type:'txt',x,y,vy:-46,life:.9,t:0,txt,col:txtcol||'#fff',size:size||15});return}
  for(let i=0;i<n;i++){const a=visualRandom()*Math.PI*2,s=spd*(.4+visualRandom()*.7);
    G.fx.push({type:'p',x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:life*(0.6+visualRandom()*.6),t:0,col,size:2+visualRandom()*3})}
}
function boom(x,y,r,dmg,col,source='explosion'){spawnFx(x,y,14,col||'#ff9a3a',240,.4);
  for(const e of G.enemies){if(e.dead)continue;const dx=e.x-x,dy=e.y-y;
    if(dx*dx+dy*dy<r*r)hurt(e,dmg*(1-Math.sqrt(dx*dx+dy*dy)/r*.5),{source})}}
function hurt(e,dmg,src){
  src=attackTraits(src);if(!attackCanHit(e,src,true))return;
  if(e.dead||G.state!=='battle')return;
  let d=dmgMods(e,dmg,src);           // 卡牌修正(武松/时迁/杨志/公孙胜等,见 CARDS 片段)
  const crit=battleRandom()<critC();
  if(crit)d*=critM();
  d=Math.round(d);
  recordDamage(e,d,src,dmg,crit);e.hp-=d;e.flash=.12;notifyHit(e);
  spawnFx(e.x+(visualRandom()-.5)*14,e.y-e.size*.6,0,'',0,0,('-'+d),crit?'#d4af37':'#fff',crit?18:13);
  if(src&&src.elem==='water')applyControl(e,'slow',1.6,src.source);
  if(e.hp<=0)killEnemy(e);
}
function killEnemy(e){
  if(e.dead)return;e.dead=true;G.kills++;SV.stats.kills++;
  gainKillEnergy(e);
  const g=Math.round(e.type.gold*silverMul());G.silver+=g;
  gainXP(Math.round(e.type.xp*(1+G.ch*.18)*(1+.25*starVal('jiangjing'))*(G.mist?1.25:1)));  // 妖雾:雾下经验+25%
  spawnFx(e.x,e.y,10,e.type.boss?'#ff5a3a':'#7a7a8a',180,.5);
  deathFx(e,true);                                      // 旗碎+星魂升天(§5.9)
  if(e.type.boss)dropJiu(e.x),victory();
  else if(battleRandom()<.07)dropJiu(e.x);  // 酒坛"三碗不过岗"掉落
}
function dropJiu(x){G.fx.push({type:'jiu',x:Math.max(80,Math.min(W-80,x)),y:WALL_Y-26,t:0,life:12})}
/* 死亡表现(§5.9):旗面碎裂 + 星魂回收(妖=误走星煞,斩落归位) */
function deathFx(e,soul){
  for(let i=0;i<5;i++)G.fx.push({type:'frag',x:e.x,y:e.y,vx:(visualRandom()-.5)*170,vy:-40-visualRandom()*100,
    rot:visualRandom()*6,vr:(visualRandom()-.5)*10,life:.6,t:0,col:e.type.flag,size:4+visualRandom()*4});
  if(soul&&G.fx.filter(f=>f.type==='soul').length<8)         // 同屏星魂≤8,超出直接闪灭
    G.fx.push({type:'soul',x:e.x,y:e.y,sx:e.x,sy:e.y,tx:Math.max(60,Math.min(W-60,e.x+(visualRandom()-.5)*140)),ty:56,life:1.2,t:0,ph:visualRandom()*9});
}
function gainXP(n){
  G.xp+=n;
  while(G.xp>=G.xpNeed&&(G.upLv<XP_CURVE.length-1||G.endless||G.tower)){G.xp-=G.xpNeed;G.upLv++;G.xpNeed=nextXPNeed(G.upLv);G.pendingLv=(G.pendingLv||0)+1}
  G.recruitDue=G.pendingLv>0;
}

  const dt=Number.isFinite(ts)?Math.max(0,Math.min((ts-lastT)/1000,.05)):0;if(Number.isFinite(ts))lastT=Math.max(lastT,ts);
  syncControls();
  if(advanceVictoryRitual(dt)){requestAnimationFrame(loop);return}
  if(canPlay()){
    G.t+=dt;G.combat.elapsed+=dt;G.cd=Math.max(0,G.cd-dt);
    if(G.shakes>0)G.shakes=Math.max(0,G.shakes-dt*3);
    if(G.wobble>0)G.wobble=Math.max(0,G.wobble-dt);
    // 本阵走位
    controlMove();moveHero(dt);
    updWaves(dt);updEnemies(dt);updateCombatInput(dt);updateMotion(dt);updBullets(dt);updActives(dt);updProjectiles(dt);updUltimate(dt);flushRecruitBatch();
  }

    const n=Math.min(24,Math.max(8,Math.round(G.count*.5))),types=unlockedTypes();

  const types=unlockedTypes(),w={yin:.32,guan:.17,dun:.15,gong:.11,fen:.10,qi:.08,yao:.07};
  let t=1.5,i=0;

    }

    if(e.type.boss&&!e.dead){

    if(e.y>=WALL_Y-e.size*.5){

        if(G.wallHP<=0)defeat()}
    }
  }
  G.enemies=G.enemies.filter(e=>!e.dead);

function dmgMods(e,d,src){
  if(G&&G.mist&&MISTS[G.mist].dr)d*=(1-MISTS[G.mist].dr);                          // 妖雾·阴煞护体
  if(e.type.armor&&!starVal('yangzhi')&&!src?.armorBreak&&!src?.armorPierce&&!(e.armorBreakT>0))d=Math.max(d*.7,d-e.type.armor-mistV('armor',0)); // 杨志·破甲(异象·魔甲妖躯+2)

  if(starVal('shiqian')&&e.hp<e.maxHp*(.3+.05*(starVal('shiqian')-1)))d*=2+.25*(starVal('shiqian')-1);                                   // 时迁·偷营
  if(e.frozenT>0)d*=1.25;                                                        // 冻结易伤(原型同款)
  if(src&&(src.elem==='water'||src.elem==='ice')&&e.burnT>0)d*=2;             // 水克火:灼烧者受水伤翻倍
  // Element weakness and resistance are resolved by targetDamageFactor.  // 妖火兵水弱点
  if(src&&(src.elem==='water'||src.elem==='ice'))d*=1+.12*(SV.treasure.eq.bishui||0);     // 碧波寒玉璧:水系增伤(原型寒冰宝石)

function victory(){

  if(G.endless){nextWave();return}
  if(G.tower){nextTowerFloor();return}
  G.state='end';
  const receipt=settleCampaignVictory();
  const final=G.lv===LEVELS.length;
  $('rtitle').textContent=final?'天魁伏诛!':'关 隘 得 保';
  $('rtitle').style.color=final?'#d4af37':'#a0c890';

function defeat(){

function requestArt(id){
 if(!ART_DATA[id])return Promise.resolve(false);
 if(Art.pending.has(id))return Art.pending.get(id);
 const promise=new Promise(resolve=>{const im=new Image();Art.images[id]=im;im.onload=()=>{Art.failed.delete(id);resolve(true)};im.onerror=()=>{Art.failed.add(id);resolve(false)};im.src=ART_DATA[id]});
 Art.pending.set(id,promise);return promise;
}

/* Distance-driven footfalls and explicit aim/release/recovery. No render-time mutation. */
const Motion={states:new WeakMap(),game:null,hero:null,clock:0};
const ARCHERY_ASSETS=['archery_upper_front','archery_upper_back','archery_fore_grip','archery_fore_draw','archery_bow','archery_arrow'];
function motionState(e){let m=Motion.states.get(e);if(!m){m={x:e.x,y:e.y,phase:e.ph||0,travel:0,speed:0,hit:0,lastStep:0};Motion.states.set(e,m)}return m}
function motionHero(){
  if(Motion.game!==G){Motion.game=G;Motion.clock=0;Motion.hero={vx:0,phase:0,walk:0,draw:0,raise:0,aim:G.aimA,shot:10,shotA:G.aimA,recoil:0,recoilV:0,lean:0,prevX:G.hero.x,lastStep:0};}
  return Motion.hero;
}
function damp(v,target,speed,dt){return target+(v-target)*Math.exp(-speed*dt)}
function approach(v,to,step){return v<to?Math.min(to,v+step):Math.max(to,v-step)}
function moveHero(dt){
  const m=motionHero(),h=G.hero,dx=h.tx-h.x,max=heroSpd();
  const desired=G.stunT>0?0:Math.sign(dx)*Math.min(max,Math.sqrt(2*1850*Math.abs(dx)));
  m.vx=approach(m.vx,desired,(Math.abs(desired)<Math.abs(m.vx)?1850:1500)*dt);
  const old=h.x;
  if(Math.abs(dx)<.65||((h.tx-h.x)*(h.tx-h.x-m.vx*dt)<=0)){h.x=h.tx;m.vx=0}
  else h.x=Math.max(HERO_X_MIN,Math.min(HERO_X_MAX,h.x+m.vx*dt));
  const distance=Math.abs(h.x-old);
  m.phase+=distance/48*Math.PI*2;
  if(Math.abs(m.vx)<8)m.phase=damp(m.phase,Math.round(m.phase/Math.PI)*Math.PI,18,dt);
  m.walk=damp(m.walk,Math.min(1,Math.abs(m.vx)/100),14,dt);
  m.lean=damp(m.lean,m.vx/max*.065,14,dt);
  const step=Math.floor(m.phase/Math.PI);
  if(step!==m.lastStep&&distance>.1&&G.fx.length<110&&!Art.reduce){
    m.lastStep=step;const side=step%2?1:-1;
    G.fx.push({type:'step',x:h.x+side*12,y:h.y+13,t:0,life:.22,r:10});
  }
}
function updateMotion(dt){
  const m=motionHero();Motion.clock+=dt;m.shot+=dt;
  const aiming=controlBowActive(),continuous=wantsContinuousShot();
  m.raise=damp(m.raise,aiming||m.shot<.28?1:0,14,dt);
  if(continuous){const p=Math.max(0,Math.min(1,((1-G.cd/Math.max(.01,G.cdMax))-.38)/.56));m.draw=p*p*(3-2*p)}
  else m.draw=damp(m.draw,aiming&&G.cd<=0&&G.stunT<=0?1:0,aiming?17:24,dt);
  const diff=Math.atan2(Math.sin(G.aimA-m.aim),Math.cos(G.aimA-m.aim));m.aim+=diff*(1-Math.exp(-32*dt));
  m.recoilV+=(-185*m.recoil-23*m.recoilV)*dt;m.recoil+=m.recoilV*dt;
  for(const e of G.enemies){if(e.dead)continue;const s=motionState(e),dist=Math.hypot(e.x-s.x,e.y-s.y);s.vx=(e.x-s.x)/Math.max(.001,dt);s.vy=(e.y-s.y)/Math.max(.001,dt);s.x=e.x;s.y=e.y;
    s.hit=Math.max(0,s.hit-dt);
    if(e.frozenT>0)continue;
    const stopped=e.key==='gong'&&e.y>=e.stopY;
    s.speed=damp(s.speed,stopped?0:Math.min(1,dist/Math.max(.001,dt)/12),12,dt);
    if(e.type.air)s.phase+=dt*7.2;
    else if(dist>0)s.phase+=Math.min(dist/Math.max(22,e.size*.85)*Math.PI*2,dt*19);
    if(stopped||(!e.type.air&&dist<.05))s.phase=damp(s.phase,Math.round(s.phase/Math.PI)*Math.PI,15,dt);
    const step=Math.floor(s.phase/Math.PI);
    if(step!==s.lastStep&&['qi','ju','dun'].includes(e.key)&&G.fx.length<100&&!Art.reduce){s.lastStep=step;G.fx.push({type:'step',x:e.x+(step%2?1:-1)*e.size*.2,y:e.y+e.size*.55,t:0,life:.24,r:e.size*.2})}
  }
}

function archeryPose(){

/* P0 effect consistency and bounded per-run accounting. Never stored in the save. */
function newCombatStats(){return {elapsed:0,rows:{},recent:[]}}
function combatRow(source='unknown'){
  return G.combat.rows[source]||(G.combat.rows[source]={damage:0,overkill:0,hits:0,control:0,healing:0});
}
function recordDamage(e,amount,src={},input=amount,crit=false){
  if(!G||G.state!=='battle'||e.dead||amount<=0)return;
  const source=src?.source||'unknown',effective=Math.min(Math.max(0,e.hp),amount),row=combatRow(source);
  row.damage+=effective;row.overkill+=amount-effective;row.hits++;
  // A small trace retains before/after modifiers, critical, and effective damage.
  G.combat.recent.push({time:G.combat.elapsed,source,target:e.key,input,resolved:amount,effective,crit,element:src?.elem||'direct'});
  if(G.combat.recent.length>60)G.combat.recent.shift();
}
function directDamage(e,amount,source){
  if(e.dead||G.state!=='battle')return;
  recordDamage(e,amount,{source});e.hp-=amount;
}
function applyBurn(e,damage,duration,source){
  if(e.dead||G.state!=='battle')return;
  e.burnD=damage;e.burnT=duration;e.burnSource=source;
}
function applyControl(e,kind,duration,source='unknown'){
  if(e.dead||G.state!=='battle')return;
  const key=kind+'T';
  if(duration>=(e[key]||0)){e[key]=duration;e[kind+'Source']=source;}
}
function trackControl(e,dt){
  if(G.state!=='battle'||e.dead)return;
  const frozen=Math.min(dt,Math.max(0,e.frozenT||0));
  if(frozen)combatRow(e.frozenSource).control+=frozen;
  const slow=Math.max(0,Math.min(dt,e.slowT||0)-frozen);
  if(slow)combatRow(e.slowSource).control+=slow;
}
function healWall(amount,source){
  if(!G||G.state!=='battle'||amount<=0)return 0;
  const effective=Math.min(amount,Math.max(0,G.wallMax-G.wallHP));
  G.wallHP+=effective;if(effective)combatRow(source).healing+=effective;
  return effective;
}
// Rescale remaining time, so recruiting a support never resets a nearly ready cast.
const combatBaseRecruit=recruitHero;
recruitHero=function(h){
  const before=Object.fromEntries(Object.entries(G.actives).map(([id,a])=>[id,{cd:a.cd,interval:a.interval}]));
  combatBaseRecruit(h);
  for(const [id,a]of Object.entries(G.actives)){
    const interval=activeInt(id),old=before[id];
    a.cd=old?Math.max(0,old.cd/old.interval*interval):Math.min(a.cd,interval);
    a.interval=interval;
  }
};

const VisualSeed={value:0x7823a51};
function battleRandom(){return G?stepRandom(G,'rngState'):NATIVE_RANDOM()}

 SV.maxLv=Math.max(1,nonnegative(SV.maxLv,LEVELS.length));SV.endless=nonnegative(SV.endless,100000);SV.tower.best=nonnegative(SV.tower.best,100000);

 }

 SV.tactic=TACTICS[SV.tactic]?SV.tactic:'balanced';SV.tutorial={arrow:false,prepTrial:false,refund:false,...SV.tutorial};SV.sound=SV.sound!==false;

/* Readability layer: bounded, cosmetic only; uses combat time, never battle RNG. */
const CombatFeedback={game:null,cues:[],maxCues:3};
const CUE_COLORS={pursuit:'#ffe0a0',conduction:'#a9edff',ready:'#d2f5bf',riposte:'#d2f5bf',focus:'#ffe0a0'};
function feedbackState(){if(CombatFeedback.game!==G){CombatFeedback.game=G;CombatFeedback.cues=[]}return CombatFeedback}
function combatCue(kind,text){
 if(!G||!CUE_COLORS[kind])return;const f=feedbackState(),now=G.combat.elapsed;
 f.cues=f.cues.filter(c=>c.until>now);
 if(kind==='riposte')f.cues=f.cues.filter(c=>c.kind!=='ready');
 const old=f.cues.find(c=>c.kind===kind);
 // Aggregate repeated procs without extending their lifetime or flooding the field.
 if(old){old.count=Math.min(99,old.count+1);return}
 if(f.cues.length>=f.maxCues)f.cues.shift();f.cues.push({kind,text,count:1,until:now+1.6});
}
function feedbackChip(text,x,y,color,width=310){
 ctx.fillStyle='#071614f2';ctx.fillRect(x-width/2,y-19,width,38);
 ctx.strokeStyle=color;ctx.lineWidth=2;ctx.strokeRect(x-width/2,y-19,width,38);
 ctx.font='bold 23px system-ui,sans-serif';ctx.fillStyle=color;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(text,x,y,width-16);
}
function dangerLine(x,y,tx,ty,color,dashed=false){
 ctx.setLineDash([]);ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(tx,ty);ctx.strokeStyle='#071614';ctx.lineWidth=9;ctx.stroke();
 ctx.setLineDash(dashed?[12,9]:[]);ctx.strokeStyle=color;ctx.lineWidth=3;ctx.stroke();ctx.setLineDash([]);
}
function combatThreats(){
 const list=[];
 for(const e of G.enemies){
  if(e.dead||e.hp<=0||e.frozenT>0)continue;
  if((e.key==='tiger'||e.key==='tiankui')&&e.y>560&&(e.leapT>0||e.leapCd<=.65)){
   const locked=e.leapT>0,tx=locked?e.ltx:G.hero.x;
   list.push({kind:'leap',x:e.x,y:e.y,tx,half:90+Math.abs(tx-e.x),eta:locked?0:.65,locked});
  }else if(e.key==='gong'&&e.y>=e.stopY&&e.shootT<=.7){
   list.push({kind:'aim',x:e.x,y:e.y,tx:G.hero.x,eta:Math.max(0,e.shootT)+(G.hero.y-e.y)/380});
  }
 }
 for(const a of G.arrows){
  if(a.dead||a.heroResolved||a.y>G.hero.y+10||a.vy<=0)continue;
  const eta=Math.max(0,(G.hero.y+10-a.y)/a.vy),tx=a.tx+(a.x-a.tx)*Math.exp(-1.1*eta);
  list.push({kind:'arrow',x:a.x,y:a.y,tx,half:48,eta});
 }
 // Actual incoming arrows outrank an archer's provisional aim; bosses rank first.
 return list.sort((a,b)=>(a.kind==='leap'?-100:0)+a.eta-((b.kind==='leap'?-100:0)+b.eta));
}
function drawCombatFeedback(){
 if(!G||!canPlay())return;
 const f=feedbackState(),now=G.combat.elapsed;f.cues=f.cues.filter(c=>c.until>now);
 ctx.save();ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';
 const threats=combatThreats();
 // Archer cues belong to the ground and bow, with no silhouette, panel or full-field beam.
 drawArcherFeedback(threats);
 for(const t of threats.filter(t=>t.kind==='leap').slice(0,2)){
  const color='#ffbb8e';
  dangerLine(t.x,t.y,t.tx,HERO_Y+10,color,!t.locked);
  const half=t.half,left=Math.max(12,t.tx-half),right=Math.min(W-12,t.tx+half);
  ctx.fillStyle='#071614dc';ctx.fillRect(left,HERO_Y-37,right-left,63);
  ctx.strokeStyle=color;ctx.lineWidth=4;ctx.strokeRect(left,HERO_Y-37,right-left,63);

};
for(const [key,[badge,detail,counter]]of Object.entries(C64_COUNTERS))ENEMY_COUNTERS['c64_'+key]={badge,color:'#d8c9a2',detail,counter};
for(const k of ['reed','cart','paper'])ENEMY_COUNTERS['c64_'+k+'_elite']={...ENEMY_COUNTERS['c64_'+k],badge:ETYPES['c64_'+k+'_elite'].name+' · 精英',detail:ENEMY_COUNTERS['c64_'+k].detail+(k==='paper'?'伴随可攻击阵眼。':'蓄力攻击锁定位置。')};

const c64Threats=levelThreatKeys;levelThreatKeys=function(i=selLv,endless=i>=LEVELS.length){const p=!endless&&C64_LEVELS[i+1];return p?[...(p.boss?['c64_'+p.boss]:p.elite?['c64_'+p.elite+'_elite']:[]),...p.keys.filter(k=>ENEMY_COUNTERS[k])]:c64Threats(i,endless)};
const c64HUD=refreshPacingHUD;refreshPacingHUD=function(){c64HUD();if(!c64Active()||G.training)return;const a=G.c64,p=c64Plan();$('lvltag').textContent=`第${G.lv}关 · ${c64Chapter().name}`;$('wavebrief').hidden=false;$('wavebrief').textContent=`${p.name} · ${Math.max(1,Math.min(p.steps,a.stage+1))}/${p.steps}`+' · '+a.stations.map(m=>`${m.kind==='sluice'?(m.x<360?'左闸':'右闸'):m.kind==='salvage'?'弩台':'妖灯'}${m.kind==='salvage'&&!m.ammo?'待装填':m.charge>=m.cd?'就绪':Math.ceil(m.cd-m.charge)+'秒'}`).join(' / ');};
const c64Start=startBattle;startBattle=function(...a){closeC64Decision();const r=c64Start(...a);if(c64Active()){G.mist=null;toast(c64Chapter().name+' · '+c64Plan().name)}return r};
const c64Victory=victory;victory=function(){const r=c64Victory();if(G?.state==='end'){closeC64Decision();if(G.lv===40)$('rtitle').textContent='妖帅伏诛 · 汴河夜渡开启';if([48,56,64].includes(G.lv))$('rtitle').textContent={48:'蛟王伏诛 · 赤炉兵寨开启',56:'赤炉熄灭 · 玄坛镇魔开启',64:'魇君伏诛 · 六十四关告捷'}[G.lv]}return r};
const c64Defeat=defeat;defeat=function(){const r=c64Defeat();if(G?.state==='end')closeC64Decision();return r};
const c64Wall=wallReportHTML;wallReportHTML=function(){let h=c64Wall();const labels={boat:'弩舟锁线',siege:'攻城轰击',rush:'统领冲锋',fuse:'火药点燃',flood:'覆江浪击',furnace:'炉心喷火'};for(const [k,v]of Object.entries(labels))h=h.replaceAll('c64_'+k,v);if(c64Active()){const s=G.c64.stats;h+=`<p class="curio-run">破招 ${s.interrupts} · 开闸 ${s.sluices} · 弩台 ${s.shots} · 点灯 ${s.lanterns} · 破眼 ${s.nodes}<br>${s.siegeHits||s.fuses?'锁定红框后移向最近空位；可在蓄力结束前集火或冻结破招。':s.repairs?'机匠修理成功：下次优先打断带扳手的后排。':s.revives?'招魂完成：先击杀幡使或冻结蓄力，可减少后续压力。':'机关充满后走近站定1.2秒；破招后的3秒是输出窗口。'}</p>`}return h};
Object.assign(DRILLS,{
 c64river:{name:'分洪截潮',tip:'走到左右闸位站定1.2秒，打断引潮巫；避开弩舟锁定红框。',heroes:{lijun:TECHNIQUES.lijun[0].id,xuning:null},keys:['c64_reed','c64_tidewitch','c64_boat'],curio:null,expansion:'river',skills:['locktide','hook']},
 c64forge:{name:'夺械断修',tip:'拆弩车、断机匠修理，再走到左侧弩台轰击；火药童可提前引爆。',heroes:{lingzhen:TECHNIQUES.lingzhen[0].id,zhangheng:null},keys:['c64_cart','c64_engineer','c64_powder'],curio:null,expansion:'forge',skills:['breach','ignite']},
 c64mirror:{name:'照影破阵',tip:'右侧点灯揭影，点击阵眼破除护持；招魂与换位均可打断。',heroes:{gongsun:TECHNIQUES.gongsun[0].id,wuyong:null},keys:['c64_paper_elite','c64_banner','c64_shadow'],curio:null,expansion:'mirror',skills:['reveal','sever']}
});
const c64Training=startTraining;startTraining=function(options=trainingOptions()){const r=c64Training(options),c=DRILLS[options.scenario];if(r&&c.expansion){G.training.expansion=c.expansion;G.c64=c64State(c.expansion);c64StationSetup(C64_CHAPTERS[c.expansion].machine);for(const m of G.c64.stations)m.charge=m.cd;for(const key of c.skills)G.act2[key]=true;warmBattleArt()}return r};
// Wave choices use the same numeric shortcuts as recruit choices.
document.addEventListener('keydown',e=>{if(!G?.c64?.decision||e.repeat)return;const choice={Digit1:'repair',Digit2:'charge',Digit3:'advance'}[e.code];if(choice){e.preventDefault();e.stopImmediatePropagation();chooseC64Decision(choice)}},true);
function c64BestiaryHTML(){
 const groups=[['river',['reed','tidewitch','boat','reed_elite','riverboss']],['forge',['cart','powder','engineer','cart_elite','forgeboss']],['mirror',['paper','banner','shadow','paper_elite','finalboss']]];
 return `<details class="c64-bestiary pacing-panel"><summary>后篇妖物图鉴 · 15种妖军与首领</summary><p>识别外形、职责和破招方式。普通弓箭与机关都能参与应对。</p>${groups.map(([chapter,ids])=>`<details><summary>${C64_CHAPTERS[chapter].name} · ${C64_CHAPTERS[chapter].from}–${C64_CHAPTERS[chapter].to}关</summary>${ids.map(id=>{const k='c64_'+id,e=ETYPES[k],c=ENEMY_COUNTERS[k];return `<div class="threat-row"><img loading="lazy" src="${artURL(k)}" alt="${e.name}"><div><b>${e.name}</b><p>${c.detail}</p><small>应对：${c.counter}</small></div></div>`}).join('')}</details>`).join('')}<div class="threat-row"><img loading="lazy" src="${artURL('c64_eye')}" alt="护持阵眼"><div><b>护持阵眼</b><p>${ENEMY_COUNTERS.c64_eye.detail}</p><small>应对：${ENEMY_COUNTERS.c64_eye.counter}</small></div></div><div class="threat-row"><img loading="lazy" src="${artURL('c64_decoy')}" alt="纸影"><div><b>纸影 · 一击可破</b><p>会吸引自动弓箭；点灯或照妖符可清除。9秒消散，不伤关隘、不掉落。</p></div></div></details>`;
}
const c64BestiaryTab=tabHTML;tabHTML=function(){const h=c64BestiaryTab();return curTab==='roster'?c64BestiaryHTML()+h:h};
const c64TrainingMenu=trainingMenuHTML;trainingMenuHTML=function(){const h=c64TrainingMenu(),c=DRILLS[Training.selection];return c.expansion?h.replace(`<h3>${c.name}</h3>`,`<h3>${c.name}</h3><p>本场免费借用：${c.skills.map(k=>C64_SKILLS[k].name).join('、')}。机关开场就绪，可直接练习站定启动。</p>`):h};
const c64TrainingFinish=finishTraining;finishTraining=function(reason){const r=c64TrainingFinish(reason);if(G?.training?.expansion&&G.training.result){const s={...G.c64.stats};G.training.result.mechanisms=s;const body=$('training-result')?.querySelector('.training-report-body');if(body&&!body.querySelector('.c64-drill-summary'))body.insertAdjacentHTML('beforeend',`<p class="curio-run c64-drill-summary">本场机关与破阵：破招${s.interrupts}次 · 开闸${s.sluices}次 · 弩台${s.shots}次 · 点灯${s.lanterns}次 · 破眼${s.nodes}次。</p>`)}return r};

/* Painted campaign assets. Rendering never consumes combat RNG. */
const C64_PAINTED=Object.keys(ART_DATA).filter(k=>k.startsWith('c64_')||k.startsWith('fx_c64_')||k.startsWith('ui_c64_'));
const c64Assets=battleAssetIds;battleAssetIds=function(){return [...new Set([...c64Assets(),...(c64Active()||Training.active||SV.campaignCleared?.includes(42)?C64_PAINTED:[])])]};
const c64Image=artImage;artImage=function(id){return c64Image(id==='battlefield'&&c64Active()?c64Chapter().scene:id)};
const c64Icon=a2Icon;a2Icon=function(key,label='',cls=''){return C64_SKILLS[key]?`<img class="a2-icon ${cls}" src="${artURL('ui_c64_'+key)}" alt="${label}" draggable="false">`:c64Icon(key,label,cls)};
for(const [key,c]of Object.entries(C64_CURIOS))UI_TREASURE[key]=key;
const c64Impact=skillImpactName;skillImpactName=function(src){const t=attackTraits(src);return C64_SKILLS[t.source]?'c64_'+t.source:c64Impact(src)};
const c64Ground=drawSkillGround;drawSkillGround=function(){c64Ground();if(!G?.c64)return;const a=G.c64;for(const f of a.fields)paintSkillSprite('c64_locktide',f.x,f.y,f.r*2,f.r*1.25,0,.6);if(!c64Active())return;
 if(a.chapter==='river'||a.phase===3){const x=120+a.tideLane*240,ebb=G.t<a.ebbUntil;ctx.save();ctx.fillStyle=ebb?'#9bd0c108':'#5cbfc41b';ctx.fillRect(x-112,270,224,WALL_Y-310);ctx.strokeStyle=ebb?'#b7d8c34a':'#98c3c796';ctx.lineWidth=2;ctx.setLineDash([12,12]);ctx.strokeRect(x-112,270,224,WALL_Y-310);ctx.restore();paintSkillSprite('c64_wave',x,420,205,96,0,ebb?.15:.4)}
};
const c64PaintEnemies=drawEnemies;drawEnemies=function(){if(c64Active())for(const e of G.enemies)if(!e.dead&&e.c64?.ward&&!e.c64.ward.dead&&e.c64.severUntil<=G.t){ctx.save();ctx.strokeStyle='#d7d5a9b0';ctx.lineWidth=2;ctx.setLineDash([7,5]);ctx.beginPath();ctx.moveTo(e.x,e.y);ctx.lineTo(e.c64.ward.x,e.c64.ward.y);ctx.stroke();ctx.restore()}return c64PaintEnemies()};
const c64PaintGround=drawGroundFx;drawGroundFx=function(){c64PaintGround();if(!c64Active())return;for(const m of G.c64.stations){const ready=m.charge>=m.cd&&(m.kind!=='salvage'||m.ammo>0),progress=ready?m.hold/1.2:m.charge/m.cd;paintSkillSprite('c64_'+m.kind,m.x,HERO_Y+26,112,100,0,ready?1:.6);ctx.save();ctx.strokeStyle=ready?'#f4da99':'#7fa599';ctx.lineWidth=5;ctx.beginPath();ctx.ellipse(m.x,HERO_Y+64,55,17,0,-Math.PI/2,-Math.PI/2+Math.min(1,progress)*Math.PI*2);ctx.stroke();ctx.restore()}};
const C64_CAST_LABELS={tide:'引潮',boat:'锁线',siege:'攻城',fuse:'点火',repair:'维修',illusion:'幻影',revive:'招魂',swap:'换位',rush:'冲锋',flood:'覆浪',furnace:'喷火'};
const c64Feedback=drawCombatFeedback;drawCombatFeedback=function(){c64Feedback();if(!c64Active()||Input.paused||scr.cards.classList.contains('on'))return;ctx.save();ctx.setLineDash([]);ctx.textAlign='center';ctx.textBaseline='middle';ctx.font='bold 18px "Songti SC",serif';
 for(const e of G.enemies){if(e.dead||!e.c64||e.y<160)continue;const c=e.c64.cast,y=Math.max(190,e.y-e.size*1.85);if(c){feedbackChip(C64_CAST_LABELS[c.kind]+' · 可破招',e.x,y,'#f3d8a1',130);ctx.fillStyle='#0b1718';ctx.fillRect(e.x-48,y+17,96,8);ctx.fillStyle='#eaca8d';ctx.fillRect(e.x-48,y+17,96*(1-c.left/c.life),8)}else if(e.type.boss||e.type.elite||e.key==='c64_eye')feedbackChip(e.type.name,e.x,y,e.key==='c64_eye'?'#b8ddd1':'#e4c598',e.type.boss?160:128);
  if(c?.kind==='swap'){const target=c64Live().find(t=>t!==e&&!t.type.boss&&!t.type.object&&t.y>e.y+40);if(target){ctx.strokeStyle='#d7b6ca';ctx.lineWidth=3;ctx.setLineDash([10,7]);ctx.beginPath();ctx.moveTo(e.x,e.y);ctx.lineTo(target.x,target.y);ctx.stroke();ctx.setLineDash([])}}
 }
 const danger=c64CriticalCasts().filter(c=>c.danger);danger.forEach((c,i)=>{const left=Math.max(0,c.x-c.width),width=Math.min(W,c.x+c.width)-left;ctx.fillStyle='#291510dd';ctx.fillRect(left,HERO_Y-65,width,115);ctx.strokeStyle='#fff3cd';ctx.lineWidth=7;ctx.strokeRect(left,HERO_Y-65,width,115);ctx.strokeStyle='#ef7059';ctx.lineWidth=3;ctx.strokeRect(left,HERO_Y-65,width,115);feedbackChip(C64_CAST_LABELS[c.kind]+' '+c.left.toFixed(1)+'秒 · 移开',Math.max(115,Math.min(W-115,c.x)),HERO_Y-94-i*35,'#ffca9b',220)});
 for(const m of G.c64.stations){const name=m.kind==='sluice'?'分洪闸':m.kind==='salvage'?'回收弩台':'照妖灯',ready=m.charge>=m.cd&&(m.kind!=='salvage'||m.ammo>0);feedbackChip(name+(m.kind==='salvage'&&!m.ammo?' · 待装填':ready?' · 站定':` ${Math.ceil(m.cd-m.charge)}秒`),m.x,HERO_Y+100,ready?'#f2dc9b':'#a4b7a8',180)}
 if(G.c64.chapter==='river'||G.c64.phase===3)feedbackChip(G.t<G.c64.ebbUntil?'截潮生效 · 水军失势':(G.t%12>=10&&G.t>=G.c64.tideForcedUntil?`${Math.ceil(12-G.t%12)}秒后涨潮移至${['左路','中路','右路'][(G.c64.tideLane+1)%3]}`:`涨潮：${['左路','中路','右路'][G.c64.tideLane]} · 水军加速`),360,270,'#b4d9dc',250);
 ctx.restore();
};
const c64Render=renderTab;renderTab=function(){c64Render();if(curTab==='tre')for(const [k,c]of Object.entries(C64_CURIOS)){const row=$('mbody').querySelector(`[data-treasure="${k}"]`);if(!row)continue;const note=document.createElement('p');note.className='curio-status';note.textContent=`需${C64_SKILLS[c.skill].name} · 最高三阶`;row.querySelector('.ds')?.append(note);if((SV.treasure.eq[k]||0)>=3){const btn=row.querySelector('[data-a="upt"]');if(btn){btn.disabled=true;btn.textContent='已满阶'}row.querySelector('.next-stat')?.remove()}}};

/* ---------- 启动 ---------- */
loadSave();
SV.treasure.inv=SV.treasure.inv||{};
selLv=Math.min(SV.maxLv,LEVELS.length)-1;
installControls();loadArt();buildMenu();show('menu');
$('rretry').onclick=()=>{G&&G.tower?startTower():startBattle(G.endless?30:G.lvIdx,G.endless)};
$('rnext').onclick=()=>startBattle(Math.min(G.lvIdx+1,LEVELS.length-1),false);
$('rhome').onclick=()=>{G=null;show('menu');renderTab()};
installRefinement();
requestAnimationFrame(loop);
